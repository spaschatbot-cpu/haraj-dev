openapi: 3.0.3

# ⚠️ مخطط **مؤقّت** — ليس العقد.
#
# العقد الحقيقي هو ‎/api/schema/‎ الذي يولّده drf-spectacular، ويُثبَّت في التاسك
# T621 من الفيز 007 (نقطة التزامن «ب» في خطة الفريق). هذا الملف موجود لسبب واحد:
# أن يعمل **خط التوليد** (T702) قبل تثبيت المخطط، فيبدأ م3 بذرة التطبيق مبكراً.
#
# ما يمثّله: ما نعرفه من specs/007-client-api/spec.md و tasks.md فقط — لا اختراع
# لنقاط لم يذكرها الفيز 007.
#
# عند تثبيت T621: بدّل `schema_path` في swagger_parser.yaml إلى ملف المخطط
# المُنزَّل من ‎/api/schema/‎، أعد التوليد، واحذف هذا الملف. لا تحرّر المولَّد.
#
# قاعدة لا تُكسر هنا: **كل مبلغ نصّ عشري** (`type: string`) لا `number` —
# المادة ٣-٢ من الدستور تسري على Dart كما تسري على بايثون.

info:
  title: حراج واحد — API العميل (مخطط مؤقّت)
  version: 0.0.0-mock
  description: >
    مخطط تمثيلي لبذرة تطبيق Flutter. يُستبدل بمخطط الخادم المثبَّت في T621.

servers:
  - url: https://api.example.invalid
    description: عنوان صوري — العنوان الحقيقي يأتي من --dart-define

tags:
  - name: auth
    description: المصادقة بالجوال وOTP
  - name: profile
    description: الملف الشخصي
  - name: auctions
    description: المزادات
  - name: vehicles
    description: المركبات
  - name: bids
    description: المزايدة
  - name: wallet
    description: المحفظة والحركات
  - name: invoices
    description: المشتريات والفواتير
  - name: devices
    description: تسجيل أجهزة الإشعارات
  - name: live
    description: البثّ الحي

security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------------------
  # المصادقة والملف الشخصي — **منسوخة حرفياً** من مخطط الخادم المثبَّت
  # (`backend/openapi/schema.yaml`): نفس المسارات ونفس `operationId` ونفس أشكال
  # الأجسام. النسخ حرفي عمداً حتى يكون التبديل في T621 بلا أثر على شيفرة
  # التطبيق: ما يتغيّر عندها هو تجميع الوسوم في العملاء لا أسماء الدوال.
  #
  # ما لم يُنسخ: الوسوم (`tags`). المخطط الحقيقي يضع مسارات المصادقة والملف تحت
  # وسم `v1` واحد فتصير كلها في عميل واحد، وهنا تبقى `auth` و`profile` كبقية
  # هذا الملف.
  /api/v1/auth/code/:
    post:
      tags: [auth]
      operationId: v1_auth_code_create
      summary: إرسال رمز تحقق
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendCode"
      responses:
        "200":
          description: أُرسل الرمز
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendCodeResponse"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/auth/verify/:
    post:
      tags: [auth]
      operationId: v1_auth_verify_create
      summary: التحقق من الرمز وإصدار الرموز
      description: >
        رقم بلا حساب يحتاج full_name، والخادم يرفض قبل أن يستهلك الرمز
        (registration_needs_name) فلا يضيع الرمز على حقل ناقص.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyCode"
      responses:
        "200":
          description: تم الدخول
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /api/v1/auth/refresh/:
    post:
      tags: [auth]
      operationId: v1_auth_refresh_create
      summary: تجديد رمز الوصول
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Refresh"
      responses:
        "200":
          description: رموز جديدة
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/auth/phone/change/:
    post:
      tags: [auth]
      operationId: v1_auth_phone_change_create
      summary: بدء تغيير رقم الجوال
      description: >
        رمزان: واحد للرقم الحالي وواحد للجديد. الرقم الحالي يُقرأ من رمز
        الوصول لا من جسم الطلب.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartPhoneChange"
      responses:
        "200":
          description: أُرسل الرمزان
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartPhoneChangeResponse"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/auth/phone/change/confirm/:
    post:
      tags: [auth]
      operationId: v1_auth_phone_change_confirm_create
      summary: تأكيد تغيير الجوال بالرمزين
      description: >
        الرمزان معاً أو لا شيء، والرفض لا يقول أيّهما أخطأ. النجاح يُلغي كل
        الجلسات — بما فيها هذه — فيعود العميل إلى الدخول بالرقم الجديد.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmPhoneChange"
      responses:
        "200":
          description: تغيّر الرقم
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedUser"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /api/v1/profile/:
    get:
      tags: [profile]
      operationId: profile_retrieve
      summary: ملفي الشخصي
      responses:
        "200":
          description: الملف
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Error"
    patch:
      tags: [profile]
      operationId: profile_update
      summary: تعديل الملف الشخصي
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchedProfileUpdate"
      responses:
        "200":
          description: الملف بعد التعديل
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/profile/national-id/:
    put:
      tags: [profile]
      operationId: profile_set_national_id
      summary: تثبيت رقم الهوية
      description: >
        هوية صحيحة على الحساب لا تتغيّر (national_id_already_verified)، وهوية
        غير صحيحة يصحّحها صاحبها بنفسه.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NationalId"
      responses:
        "200":
          description: الملف بعد التثبيت
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/profile/company/:
    get:
      tags: [profile]
      operationId: profile_company_retrieve
      summary: ملف الشركة
      description: >
        404 حين لا شركة على الحساب — «لا شركة» و«شركة بحقول فارغة» جوابان
        مختلفان، والشاشة التي لا تفرّق بينهما تعرض نموذج تعديل لشيء غير موجود.
      responses:
        "200":
          description: ملف الشركة
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyProfileRead"
        "404":
          $ref: "#/components/responses/Error"
    put:
      tags: [profile]
      operationId: profile_company_save
      summary: حفظ ملف الشركة
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyProfile"
      responses:
        "200":
          description: ملف الشركة بعد الحفظ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyProfileRead"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/auctions:
    get:
      tags: [auctions]
      operationId: auctionsList
      summary: المزادات الجارية والقادمة
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AuctionStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: صفحة مزادات
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAuctionList"

  /api/v1/auctions/{auctionId}:
    get:
      tags: [auctions]
      operationId: auctionsRetrieve
      summary: تفاصيل مزاد
      parameters:
        - name: auctionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: المزاد
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Auction"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/auctions/{auctionId}/vehicles:
    get:
      tags: [vehicles]
      operationId: auctionVehiclesList
      summary: مركبات المزاد — بحث وترشيح
      parameters:
        - name: auctionId
          in: path
          required: true
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
        - name: make
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
        - name: year_from
          in: query
          required: false
          schema:
            type: integer
            minimum: 1900
            maximum: 2200
        - name: year_to
          in: query
          required: false
          schema:
            type: integer
            minimum: 1900
            maximum: 2200
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: صفحة مركبات
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedVehicleCardList"

  /api/v1/vehicles/{vehicleId}:
    get:
      tags: [vehicles]
      operationId: vehiclesRetrieve
      summary: تفاصيل مركبة
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: المركبة
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/vehicles/{vehicleId}/bids:
    post:
      tags: [bids]
      operationId: bidsPlace
      summary: وضع مزايدة — الخفض يحتاج تأكيداً صريحاً
      description: >
        الخفض يُرفض بـ409 ورمز lower_needs_confirm، وحمولة الرفض تحمل
        `standing` و`requested`. يُعاد الإرسال بـconfirm_lower=true بعد تأكيد
        المستخدم على المبلغين.
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BidSubmission"
      responses:
        "201":
          description: سُجّلت المزايدة
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bid"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /api/v1/bids/mine:
    get:
      tags: [bids]
      operationId: bidsMineList
      summary: مزايداتي
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: صفحة مزايدات
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedBidList"

  /api/v1/bids/{bidId}/withdraw:
    post:
      tags: [bids]
      operationId: bidsWithdraw
      summary: سحب مزايدة
      description: >
        السحب يُعلَّم ولا يُحذف — تعود المزايدة بحالتها الجديدة. ملكية المزايدة
        قرار الخادم: مزايدة غيرك ترجع 404، لا 403.
      parameters:
        - name: bidId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: سُحبت المزايدة
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bid"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /api/v1/live:
    get:
      tags: [live]
      operationId: liveUpdates
      summary: البثّ الحي — مزايدات المتصل وحده
      description: >
        بثّ SSE (`text/event-stream`). كل إطار `event: state` يحمل في `data`
        كائن LiveState. لا يحمل رقم أحد غيرك: المزاد مغلق ولا نقطة تسرد
        مزايدات مركبة.
      responses:
        "200":
          description: بثّ مستمر — الإطار الواحد نصّ SSE، وحمولته LiveState
          content:
            text/event-stream:
              schema:
                type: string

  /api/v1/wallet:
    get:
      tags: [wallet]
      operationId: walletRetrieve
      summary: المحفظة — الدلاء مفصَّلة بأسبابها
      description: >
        لا مجموع واحد. كل دلو ببيانه وسببه (أي مزاد، أي فاتورة) — قاعدة G5 في
        الفيز 007 وقاعدة العرض 2 في الفيز 008.
      responses:
        "200":
          description: الدلاء
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/wallet/transactions:
    get:
      tags: [wallet]
      operationId: walletTransactionsList
      summary: كشف الحركات من القيود مباشرةً
      description: >
        الترشيح على دلو واحد هو النصف الثاني من المادة ١-٦: كل رقم في المحفظة
        يُفتح على القيود التي تفسّره. الترشيح يقع على الخادم لا في الشاشة —
        نظيره في الخلفية `bucket` في `StatementQuerySerializer`.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: bucket
          in: query
          required: false
          description: دلو واحد بعينه — القيمة كما أرسلها الخادم في `WalletBucket.kind`
          schema:
            $ref: "#/components/schemas/WalletBucketKind"
      responses:
        "200":
          description: صفحة حركات
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedLedgerEntryList"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/wallet/topup-intents:
    post:
      tags: [wallet]
      operationId: walletTopUpIntentCreate
      summary: نيّة شحن — المبلغ من الخادم لا من الطلب
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopUpIntentRequest"
      responses:
        "201":
          description: نيّة الشحن ورابط البوابة
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopUpIntent"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/wallet/topup-intents/{reference}:
    get:
      tags: [wallet]
      operationId: walletTopUpIntentRetrieve
      summary: حالة نيّة الشحن كما يعرفها الخادم
      description: >
        العودة من البوابة تُسنَد من هنا، لا من معاملات رابط العودة. المرجع
        ليس ادّعاءً: هو اسم صفّ كتبه الخادم قبل أن يصل العميل إلى البوابة
        أصلاً، والرصيد يتحرّك بتأكيد البوابة للخادم وحده. نظيره في الخلفية
        `GET /api/v1/wallet/topups/{reference}/`.
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: حالة النيّة
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopUpIntent"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/wallet/refund-requests:
    post:
      tags: [wallet]
      operationId: walletRefundRequestCreate
      summary: طلب استرداد من المتاح فقط
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundRequestInput"
      responses:
        "201":
          description: سُجّل الطلب
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundRequest"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/invoices:
    get:
      tags: [invoices]
      operationId: invoicesList
      summary: فواتيري
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: صفحة فواتير
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedInvoiceList"

  /api/v1/participations:
    get:
      tags: [auctions]
      operationId: participationsList
      summary: مشاركاتي — المزادات التي دخلتها وحالة تأميني في كل واحد
      description: >
        حالة التأمين لكل مزاد **يشتقّها الخادم** من حجوزاته. لا تُركَّب في
        التطبيق من «مزايداتي» و«المحفظة»: التركيب قاعدة عمل، وقاعدة في الشاشة
        نسخة ثانية تفترق عن الأصل (المادة ٤-٥).
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: صفحة مشاركات
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedParticipationList"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/purchases:
    get:
      tags: [invoices]
      operationId: purchasesList
      summary: مشترياتي — ما رسا عليّ، ومعه فاتورته
      description: >
        الفاتورة تأتي **داخل** المشترى لا بمطابقة معرّفات في التطبيق — نفس ما
        تفعله نقطة المشتريات في الخلفية (`PurchaseSerializer.get_invoice`).
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: صفحة مشتريات
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedPurchaseList"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/devices:
    post:
      tags: [devices]
      operationId: devicesRegister
      summary: تسجيل جهاز للإشعارات — يُربط بالمستخدم من الرمز
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRegistration"
      responses:
        "201":
          description: سُجّل الجهاز
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "403":
          $ref: "#/components/responses/Error"

  /api/v1/devices/unregister:
    post:
      tags: [devices]
      operationId: devicesUnregister
      summary: إلغاء تسجيل جهاز عند الخروج — بالرمز، وبمالكه من رمز الدخول
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceUnregistration"
      responses:
        "204":
          description: هذا الجهاز لم يعد يستقبل إشعارات هذا المستخدم
        "403":
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100

  responses:
    Error:
      description: الشكل الموحّد للأخطاء — الرسالة عربية جاهزة للعرض
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"

  schemas:
    # ---------- الشكل الموحّد للأخطاء (الفيز 001 / T705) ----------
    ApiErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ApiErrorBody"

    ApiErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: رمز ثابت يفهمه العميل — لا يُترجم ولا يُعرض
          example: otp_incorrect
        message:
          type: string
          description: >
            رسالة عربية جاهزة للعرض كما جاءت. **ممنوع** على التطبيق استبدالها
            بنصّ محلي لحالة يعرفها الخادم.
          example: مبلغ المزايدة أقل من الحد الأدنى المسموح.
        detail:
          type: object
          nullable: true
          additionalProperties:
            nullable: true
          description: >
            بيانات الرفض نفسه — لا تُعرض نصّاً، لكن الشاشة تقتبس منها أرقاماً
            سألها الخادم عنها (مثل مبلغَي تأكيد الخفض).

    # ---------- المصادقة ----------
    # منسوخة من `backend/openapi/schema.yaml` بأسمائها وحقولها. الرمز نفسه لا
    # يظهر في أي جسم استجابة هنا — ولا يجوز أن يظهر: جسم يستطيع حمل الأرقام
    # يحملها يوماً.
    SendCode:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          pattern: ^9665\d{8}$
          example: "966501234567"
        purpose:
          $ref: "#/components/schemas/SendCodePurposeEnum"

    SendCodePurposeEnum:
      type: string
      default: login
      enum: [login, change_phone, recover]
      description: >
        login دخول أو تسجيل · change_phone تغيير رقم الجوال · recover استعادة
        الحساب

    SendCodeResponse:
      type: object
      required: [sent, expires_at, resend_after]
      properties:
        sent:
          type: boolean
        expires_at:
          type: string
          format: date-time
          description: ISO-8601 بتوقيت UTC — التحويل للعرض عند حافة العرض وحدها
        resend_after:
          type: integer
          description: ثوانٍ حتى يُسمح بطلب رمز جديد

    VerifyCode:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
          pattern: ^9665\d{8}$
        code:
          type: string
          minLength: 4
          maxLength: 8
        full_name:
          type: string
          maxLength: 200
          description: يُستعمل عند إنشاء الحساب لأول مرة فقط

    Refresh:
      type: object
      required: [refresh]
      properties:
        refresh:
          type: string

    TokenPair:
      type: object
      required: [access, refresh, expires_in, expires_at]
      properties:
        access:
          type: string
        refresh:
          type: string
        expires_in:
          type: integer
          description: عمر رمز الوصول بالثواني
        expires_at:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/AuthenticatedUser"

    AuthenticatedUser:
      type: object
      required: [id, phone, display_name, account_type, is_new]
      properties:
        id:
          type: integer
        phone:
          type: string
        display_name:
          type: string
        account_type:
          type: string
        is_new:
          type: boolean
          description: أول دخول لهذا الرقم

    StartPhoneChange:
      type: object
      required: [new_phone]
      properties:
        new_phone:
          type: string
          pattern: ^9665\d{8}$

    StartPhoneChangeResponse:
      type: object
      required: [sent_to_current, sent_to_new, expires_at, resend_after]
      properties:
        sent_to_current:
          type: boolean
        sent_to_new:
          type: boolean
        expires_at:
          type: string
          format: date-time
        resend_after:
          type: integer

    ConfirmPhoneChange:
      type: object
      required: [new_phone, current_code, new_code]
      properties:
        new_phone:
          type: string
          pattern: ^9665\d{8}$
        current_code:
          type: string
          minLength: 4
          maxLength: 8
          description: الرمز المُرسَل إلى الرقم الحالي
        new_code:
          type: string
          minLength: 4
          maxLength: 8
          description: الرمز المُرسَل إلى الرقم الجديد

    # ---------- الملف الشخصي ----------
    Profile:
      type: object
      required:
        - id
        - phone
        - display_name
        - full_name
        - account_type
        - national_id
        - national_id_verified
        - phone_verified_at
        - has_company_profile
        - company_profile_complete
        - locked_fields
      properties:
        id:
          type: integer
        phone:
          type: string
          readOnly: true
          description: يتغيّر عبر مسار خاص
        display_name:
          type: string
          readOnly: true
        full_name:
          type: string
          maxLength: 200
        email:
          type: string
        account_type:
          type: string
          readOnly: true
        national_id:
          type: string
          readOnly: true
        national_id_verified:
          type: boolean
          readOnly: true
        phone_verified_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        has_company_profile:
          type: boolean
          readOnly: true
        company_profile_complete:
          type: boolean
          readOnly: true
        locked_fields:
          type: array
          readOnly: true
          description: الحقول التي تُعرض ولا تُعدَّل، وسبب كلٍّ منها بالعربية
          items:
            $ref: "#/components/schemas/LockedField"

    LockedField:
      type: object
      required: [field, reason]
      properties:
        field:
          type: string
        reason:
          type: string
          description: سبب عربي جاهز للعرض — لا يصوغه التطبيق

    PatchedProfileUpdate:
      type: object
      description: >
        ما يملك العميل تغييره عن نفسه ولا شيء غيره. مفتاح غير معروف يُرفض ولا
        يُهمَل.
      properties:
        full_name:
          type: string
          maxLength: 200
        email:
          type: string

    NationalId:
      type: object
      required: [national_id]
      properties:
        national_id:
          type: string
          pattern: ^\d{10}$

    CompanyProfile:
      type: object
      description: >
        بلا حقل إلزامي في هذه الطبقة: اكتمال شركة جديدة قاعدة عمل لها تاريخ،
        وتعيش في الخادم لا في المخطط.
      properties:
        name:
          type: string
          maxLength: 200
        representative_name:
          type: string
          maxLength: 200
        commercial_register:
          type: string
          maxLength: 32
        vat_number:
          type: string
          maxLength: 32
        building_number:
          type: string
          maxLength: 8
        street:
          type: string
          maxLength: 200
        district:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 100
        postal_code:
          type: string
          maxLength: 8

    CompanyProfileRead:
      type: object
      required: [is_complete]
      properties:
        name:
          type: string
          maxLength: 200
        representative_name:
          type: string
          maxLength: 200
        commercial_register:
          type: string
          maxLength: 32
        vat_number:
          type: string
          maxLength: 32
        building_number:
          type: string
          maxLength: 8
        street:
          type: string
          maxLength: 200
        district:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 100
        postal_code:
          type: string
          maxLength: 8
        is_complete:
          type: boolean
          readOnly: true
          description: هل تكفي هذه البيانات لإصدار فاتورة ضريبية

    # ---------- المزادات ----------
    AuctionStatus:
      type: string
      enum: [draft, scheduled, running, ended, settled, cancelled]

    Auction:
      type: object
      required: [id, title, status, starts_at, ends_at, vehicles_count]
      properties:
        id:
          type: string
        title:
          type: string
        status:
          $ref: "#/components/schemas/AuctionStatus"
        starts_at:
          type: string
          format: date-time
          description: ISO-8601 بتوقيت UTC — التحويل للعرض في التطبيق
        ends_at:
          type: string
          format: date-time
        vehicles_count:
          type: integer

    PaginatedAuctionList:
      type: object
      required: [count, results]
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: "#/components/schemas/Auction"

    # ---------- المركبات ----------
    VehicleCard:
      type: object
      required: [id, lot_number, title, thumbnail_url, reserve_price, current_bid_amount, currency, bids_count]
      properties:
        id:
          type: string
        lot_number:
          type: string
        title:
          type: string
        thumbnail_url:
          type: string
          nullable: true
          description: مصغَّرة فقط في القوائم — الحجم الكامل عند الفتح
        reserve_price:
          type: string
          nullable: true
          description: >
            سعر وقوف المركبة — الحقل **الوحيد** لسعرها (المادة ٨-٣ في دليل
            النظام، ونظيره `reserve_price` في مخطط الخادم المثبَّت). الفراغ
            يعني أن المالك لم يحدّد سعراً، وهو غير الصفر.
          example: "50000.00"
        current_bid_amount:
          type: string
          description: نصّ عشري — يُعرض كما وصل
          example: "12500.00"
        currency:
          type: string
          example: SAR
        bids_count:
          type: integer

    Vehicle:
      type: object
      required: [id, lot_number, title, images, specifications, reserve_price, current_bid_amount, currency, bidding_open]
      properties:
        id:
          type: string
        lot_number:
          type: string
        title:
          type: string
        images:
          type: array
          items:
            type: string
        specifications:
          type: array
          items:
            $ref: "#/components/schemas/Specification"
        reserve_price:
          type: string
          nullable: true
          description: نفس الحقل الذي يحمله الكرت — سعر واحد لا سعران
          example: "50000.00"
        current_bid_amount:
          type: string
          example: "12500.00"
        minimum_next_bid_amount:
          type: string
          example: "12600.00"
        currency:
          type: string
        bidding_open:
          type: boolean

    Specification:
      type: object
      required: [label, value]
      properties:
        label:
          type: string
          description: تسمية عربية من الخادم
        value:
          type: string

    PaginatedVehicleCardList:
      type: object
      required: [count, results]
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: "#/components/schemas/VehicleCard"

    # ---------- المزايدة ----------
    BidSubmission:
      type: object
      required: [amount]
      properties:
        amount:
          type: string
          description: نصّ عشري كما يُدخله المستخدم — لا حساب في التطبيق
          example: "12600.00"
        confirm_lower:
          type: boolean
          description: تأكيد صريح لخفض المزايدة بعد 409

    BidStatus:
      type: string
      enum: [placed, outbid, leading, withdrawn, won, lost]

    Bid:
      type: object
      required: [id, vehicle_id, amount, currency, status, status_label, placed_at]
      properties:
        id:
          type: string
        vehicle_id:
          type: string
        vehicle_title:
          type: string
          nullable: true
        amount:
          type: string
          example: "12600.00"
        currency:
          type: string
        status:
          $ref: "#/components/schemas/BidStatus"
        status_label:
          type: string
          description: وصف عربي من الخادم — لا خريطة حالات في التطبيق
        placed_at:
          type: string
          format: date-time

    PaginatedBidList:
      type: object
      required: [count, results]
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: "#/components/schemas/Bid"

    # ---------- حمولة البثّ الحي ----------
    LiveState:
      type: object
      required: [bids, vehicles]
      description: >
        حمولة إطار `event: state`. مزايدات المتصل نفسه، وحالات عامة للمركبات
        التي يزايد عليها — لا رقم منافس ولا «أنت الأعلى».
      properties:
        bids:
          type: array
          items:
            $ref: "#/components/schemas/LiveBid"
        vehicles:
          type: array
          items:
            $ref: "#/components/schemas/LiveVehicle"

    LiveBid:
      type: object
      required: [id, vehicle_id, amount, is_withdrawn, is_superseded]
      properties:
        id:
          type: string
        vehicle_id:
          type: string
        amount:
          type: string
          description: نصّ عشري كما في الدفتر
          example: "12600.00"
        is_withdrawn:
          type: boolean
        is_superseded:
          type: boolean

    LiveVehicle:
      type: object
      required: [id, state, state_label, auction_state]
      properties:
        id:
          type: string
        state:
          type: string
        state_label:
          type: string
          description: وصف عربي من الخادم — لا خريطة حالات في التطبيق
        auction_state:
          type: string

    # ---------- المحفظة ----------
    WalletBucketKind:
      type: string
      enum: [wallet, insurance_free, insurance_held, insurance_locked]

    WalletBucket:
      type: object
      required: [kind, label, amount, currency]
      properties:
        kind:
          $ref: "#/components/schemas/WalletBucketKind"
        label:
          type: string
          description: اسم الدلو بالعربية من الخادم
        amount:
          type: string
          description: نصّ عشري — **ممنوع جمع الدلاء في التطبيق**
          example: "10000.00"
        currency:
          type: string
        holds:
          type: array
          description: سبب كل حجز — أي مزاد، أي فاتورة
          items:
            $ref: "#/components/schemas/WalletHold"

    WalletHold:
      type: object
      required: [reference, reason, amount, currency]
      properties:
        reference:
          type: string
          description: معرّف المزاد أو الفاتورة
        reason:
          type: string
          description: سبب عربي جاهز للعرض
        amount:
          type: string
          example: "2500.00"
        currency:
          type: string

    Wallet:
      type: object
      required: [buckets, as_of]
      properties:
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/WalletBucket"
        as_of:
          type: string
          format: date-time

    LedgerEntry:
      type: object
      required:
        [id, description, bucket_label, amount, currency, direction, occurred_at]
      properties:
        id:
          type: string
        description:
          type: string
          description: وصف عربي لنوع المعاملة — لا مفتاح إنجليزي
        bucket:
          $ref: "#/components/schemas/WalletBucketKind"
        bucket_label:
          type: string
          description: اسم الدلو بالعربية من الخادم
        amount:
          type: string
          example: "500.00"
        currency:
          type: string
        direction:
          type: string
          description: >
            اتجاه الحركة كما يقوله الخادم: دخل أم خرج. **ليست** `debit/credit`
            عمداً — معناهما يتبع جهة الحساب، فقراءتهما في الشاشة اجتهاد في
            اصطلاح محاسبي مكتوب مرة واحدة في `apps/money/models`. نظيره في
            الخلفية `LedgerEntrySerializer.get_direction`.
          enum: [in, out]
        occurred_at:
          type: string
          format: date-time
        reference:
          type: string
          nullable: true

    PaginatedLedgerEntryList:
      type: object
      required: [count, results]
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: "#/components/schemas/LedgerEntry"

    TopUpIntentRequest:
      type: object
      properties:
        preset:
          type: string
          nullable: true
          description: >
            مفتاح مبلغ معرَّف في الخادم. اختياري لأن الخادم هو من يحدّد المبلغ
            أصلاً (`deposit_amount_for` في الخلفية)، وطلب بلا مفتاح يعني «المبلغ
            الذي تقرّره أنت». التطبيق لا يرسل مبلغاً في أي حال.

    TopUpIntent:
      type: object
      required: [reference, amount, currency, redirect_url, status, status_label]
      properties:
        reference:
          type: string
        amount:
          type: string
          description: المبلغ يحدّده الخادم ويُعرض كما وصل
          example: "1000.00"
        currency:
          type: string
        redirect_url:
          type: string
          description: عنوان البوابة — يفتحه التطبيق ولا يقرأ ما يعود منه
        status:
          type: string
          enum: [pending, succeeded, cancelled, failed]
        status_label:
          type: string
          description: >
            وصف الحالة بالعربية من الخادم. موجود لأن خريطة حالات في التطبيق
            نسخة ثانية من قاعدة يملكها الخادم (المادة ٤-٥). نظيره في الخلفية
            `PaymentIntentSerializer.state_label`.

    RefundRequestInput:
      type: object
      required: [amount]
      properties:
        amount:
          type: string
          example: "1000.00"

    RefundRequest:
      type: object
      required: [reference, amount, currency, status, status_label, requested_at]
      properties:
        reference:
          type: string
        amount:
          type: string
        currency:
          type: string
        status:
          type: string
          enum: [requested, sent, confirmed, rejected]
        status_label:
          type: string
        requested_at:
          type: string
          format: date-time

    # ---------- المشاركات ----------
    InsuranceState:
      type: string
      description: حالة تأمين المزايد في مزاد بعينه — يشتقّها الخادم من الحجوزات
      enum: [none, held, locked, released]

    Participation:
      type: object
      required:
        [auction_id, auction_title, auction_status_label, ends_at, bids_count,
         insurance_state, insurance_state_label]
      properties:
        auction_id:
          type: string
        auction_title:
          type: string
        auction_status_label:
          type: string
          description: >
            حالة المزاد بالعربية من الخادم. الحالة تصل **مسمّاة** لا مرمَّزة،
            لأن خريطة حالات في التطبيق نسخة ثانية تفترق عن الأصل.
        ends_at:
          type: string
          format: date-time
        bids_count:
          type: integer
          description: عدد مزايداتي في هذا المزاد — يعدّها الخادم
        insurance_state:
          $ref: "#/components/schemas/InsuranceState"
        insurance_state_label:
          type: string
          description: وصف عربي جاهز للعرض — لا خريطة حالات في التطبيق
        insurance_amount:
          type: string
          nullable: true
          description: مبلغ المحجوز أو المقفول لهذا المزاد، إن وُجد
          example: "2500.00"
        currency:
          type: string
          nullable: true

    PaginatedParticipationList:
      type: object
      required: [count, results]
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: "#/components/schemas/Participation"

    # ---------- المشتريات ----------
    PurchaseState:
      type: string
      description: حالة المركبة التي رست على المشتري
      enum: [awarded, invoiced, paid, handed_over, cancelled]

    Purchase:
      type: object
      required:
        [id, vehicle_id, lot_number, title, auction_title, awarded_amount,
         currency, awarded_at, state, state_label]
      properties:
        id:
          type: string
        vehicle_id:
          type: string
        lot_number:
          type: string
        title:
          type: string
        auction_title:
          type: string
        awarded_amount:
          type: string
          description: سعر الرسوّ كما رحّله الخادم — نصّ عشري يُعرض كما وصل
          example: "12600.00"
        currency:
          type: string
        awarded_at:
          type: string
          format: date-time
        state:
          $ref: "#/components/schemas/PurchaseState"
        state_label:
          type: string
          description: حالة المركبة بالعربية من الخادم
        invoice:
          $ref: "#/components/schemas/Invoice"

    PaginatedPurchaseList:
      type: object
      required: [count, results]
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: "#/components/schemas/Purchase"

    # ---------- الفواتير ----------
    Invoice:
      type: object
      required: [id, number, total_amount, paid_amount, due_amount, currency, status, status_label, issued_at]
      properties:
        id:
          type: string
        number:
          type: string
        total_amount:
          type: string
          example: "12600.00"
        paid_amount:
          type: string
          example: "0.00"
        due_amount:
          type: string
          description: يأتي محسوباً من الخادم — التطبيق لا يطرح
          example: "12600.00"
        currency:
          type: string
        status:
          type: string
          enum: [open, partially_paid, paid, cancelled]
        status_label:
          type: string
        issued_at:
          type: string
          format: date-time
        insurance_lock:
          $ref: "#/components/schemas/InsuranceLock"

    InsuranceLock:
      type: object
      description: >
        ما تعنيه هذه الفاتورة لتأمين صاحبها. يغيب حين لا يكون على التأمين قفل.
        نصّه من الخادم لأن **من كتب القاعدة يكتب شرحها**: أكثر ما أربك عملاء v1
        رصيد يرونه ولا يستطيعون سحبه بلا سبب معروض.
      required: [amount, currency, note]
      properties:
        amount:
          type: string
          example: "2500.00"
        currency:
          type: string
        note:
          type: string
          description: شرح عربي جاهز للعرض — يُعرض حرفياً

    PaginatedInvoiceList:
      type: object
      required: [count, results]
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: "#/components/schemas/Invoice"

    # ---------- الإشعارات ----------
    # لا حقل `user` في أيٍّ من الاثنين، وغيابه هو التصميم كله: المالك يأتي من
    # رمز الدخول. ثغرة v1 كانت حقلاً في الجسم — تسجيل باسم عميل آخر فتصله
    # إشعاراته، وإلغاء تسجيله فتنقطع عنه تنبيهات المزايدة بلا أن يدري.
    DeviceRegistration:
      type: object
      required: [token, platform]
      properties:
        token:
          type: string
        platform:
          type: string
          enum: [android, ios]

    DeviceUnregistration:
      type: object
      required: [token]
      properties:
        token:
          type: string

    Device:
      type: object
      required: [id, platform, registered_at]
      properties:
        id:
          type: string
        platform:
          type: string
          enum: [android, ios]
        registered_at:
          type: string
          format: date-time
