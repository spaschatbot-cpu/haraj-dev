# خط توليد عميل الـAPI (T702).
#
# التشغيل:
#   dart run swagger_parser        # يكتب lib/data/api/generated
#   dart run build_runner build -d # يكمّل ملفات .g.dart لنماذج json_serializable
#
# ممنوع تحرير أي ملف تحت output_directory بيد. كل تعديل يبدأ من المخطط.
#
# **المصدر هو مخطط الخلفية**، لا نسخةً منه ولا وهميّاً بجواره.
#
# كان `openapi/haraj-mock.yaml` — عقدٌ كُتب بيد قبل أن تُوجد الخلفية، وقد
# انحرف عنها: يقول `count` والخلفية تقول `total`، ويسمّي `{vehicleId}` وهي
# تسمّي `{id}`، وينقصه ثمانيةُ مسارات (المفضّلة، تسعيرة المزايدة، سداد
# الفاتورة، صور المركبة، ردّ الدفع، صفحة الشحن). فكان التطبيق يبني وينجح
# ويسقط عند أوّل استجابةٍ حقيقية بـ`TypeError` صامتٍ يبتلعه معالج الأخطاء
# ويعرض «حدث خطأ غير متوقع» — عطلٌ لا يُرى في أي سجل.
#
# والمسار نسبيٌّ إلى ملفّ الخلفية مباشرةً لا إلى نسخةٍ في `mobile/`: نسختان
# لعقدٍ واحد تنحرفان، وهذا الانحرافُ بعينه هو ما كلّف هذه الجلسة.
# `backend/openapi/schema.yaml` نفسه محروسٌ في CI ضدّ ما يولّده الكود.

swagger_parser:
  schema_path: ../backend/openapi/schema.yaml
  output_directory: lib/data/api/generated
  language: dart
  json_serializer: json_serializable
  default_content_type: "application/json"

  # عميل جذر واحد يجمع عملاء الوسوم (auth، wallet، bids…)
  root_client: true
  root_client_name: HarajApiClient
  client_postfix: Api
  export_file: true
  put_clients_in_folder: true

  # أسماء الدوال من operationId — أوضح من المسار، وتبقى ثابتة عبر تغيّر المسارات
  path_method_name: false

  # قيمة enum لم نرها من قبل لا تُسقط الاستجابة — المادة ٢-٣ و٣-٥ من الدستور
  unknown_enum_value: true
  enums_parent_prefix: true

  mark_files_as_generated: true
