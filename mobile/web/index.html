<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="haraj_mobile">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>حراج واحد</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F3F5F8">
</head>
<body>
  <!--
    شاشة البدء للويب — نسخةُ HTML من شاشة البدء الدارتيّة (`splash_screen.dart`).

    حزمةُ الويب اثنا عشر ميغابايت تُنقل قبل أوّل إطارٍ من Flutter، وطوال ذلك
    كانت الصفحةُ بيضاءَ فارغة تُقرأ عطلاً لا تحميلاً. وشاشةُ البدء الدارتيّة
    لا تنفع هنا: هي نفسُها داخل تلك الحزمة.

    **وتُكتب مرّتين لتكون الصورةُ الأولى هي نفسَها**: بأمر المالك (٢٩ سبتمبر
    ٢٠٢٦) «عايز الاسبلاش من أوّل التحميل يتظبط التصميم بتاعها». فالتصميمُ
    الفاتح نفسُه — القرصُ الداكن بإطاره الأبيض، والحلقتان، والعنوان، وسطرُ
    الانتظار، والتذييل — بالمقاسات والألوان نفسِها من HarajPalette الفاتح.
    من بدّل هناك يبدّل هنا. ولا شارةَ ولا شريطَ ولا زرّ: شالها المالك من
    الدارتيّة في اليوم نفسه.
  -->
  <style>
    #boot {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      padding: 18px 24px 12px;
      box-sizing: border-box;
      overflow: hidden;
      background: linear-gradient(180deg, #EBF0F7 0%, #F3F5F8 50%, #E6EDF6 100%);
      font-family: "IBMPlexSansArabic", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #12263C;
      direction: rtl;
      transition: opacity .25s ease;
    }
    #boot.gone { opacity: 0; pointer-events: none; }

    .boot-grow { flex: 3 1 auto; min-block-size: 8px; }
    .boot-grow.low { flex-grow: 4; }

    .boot-mark {
      --mark: 260px;
      align-self: center;
      position: relative;
      inline-size: var(--mark);
      block-size: var(--mark);
      flex: 0 0 auto;
      display: grid;
      place-items: center;
    }
    .boot-mark > * { grid-area: 1 / 1; }
    .boot-ring {
      inline-size: 100%;
      block-size: 100%;
      border-radius: 50%;
      border: 1px solid rgba(28,111,214,.12);
      background: radial-gradient(circle, rgba(28,111,214,.10), rgba(28,111,214,0) 70%);
    }
    .boot-ring.dashed {
      inline-size: 81%;
      block-size: 81%;
      background: none;
      border: 1.2px dashed rgba(28,111,214,.30);
    }
    .boot-disc {
      inline-size: 54%;
      block-size: 54%;
      border-radius: 50%;
      box-sizing: border-box;
      border: 5px solid #fff;
      background: linear-gradient(225deg, #0f3c73 0%, #050D17 100%);
      box-shadow: 0 12px 36px rgba(28,111,214,.28);
      display: grid;
      place-items: center;
    }
    /* مقاسٌ صريحٌ من --mark لا نسبةٌ من القرص: حشوةٌ بالنسبة داخل خليّة
       شبكةٍ تُحسب دوريّاً، فرُسم الشعارُ ٢٧ بكسلاً في قرصٍ من ١٤٠ — قِيس. */
    .boot-disc img { inline-size: calc(var(--mark) * .54 * .6); block-size: calc(var(--mark) * .54 * .6); object-fit: contain; }

    .boot-title {
      margin: 24px 0 0;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -.4px;
      text-align: center;
    }
    .boot-tagline {
      margin: 10px 0 0;
      font-size: 16px;
      line-height: 1.6;
      color: #5F7488;
      text-align: center;
    }

    .boot-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      block-size: 56px;
      font-size: 14px;
      color: #5F7488;
    }
    .boot-status b {
      inline-size: 14px;
      block-size: 14px;
      border-radius: 50%;
      border: 2px solid rgba(28,111,214,.15);
      border-top-color: #1C6FD6;
      animation: boot-spin .8s linear infinite;
    }
    @keyframes boot-spin { to { transform: rotate(360deg); } }

    .boot-foot {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-block-start: 24px;
      padding-block-start: 14px;
      border-top: 1px solid rgba(201,216,232,.6);
      font-size: 12px;
      color: #5F7488;
    }
    .boot-foot svg { flex: 0 0 auto; }
    .boot-foot .place { flex: 1 1 auto; white-space: nowrap; overflow: hidden; }
    .boot-foot .ver { color: rgba(95,116,136,.75); white-space: nowrap; }

    @media (prefers-reduced-motion: reduce) {
      .boot-status b { animation: none; }
      #boot { transition: none; }
    }

    /* على شاشةٍ قصيرة يصغر الشعارُ بدل أن يُقصَّ الذيل — عتبةُ OnboardingMetrics. */
    @media (max-height: 700px) {
      .boot-mark { --mark: 165px; }
      .boot-title { font-size: 24px; margin-block-start: 16px; }
    }
  </style>

  <div id="boot" role="status" aria-live="polite">
    <div class="boot-grow"></div>

    <div class="boot-mark" aria-hidden="true">
      <span class="boot-ring"></span>
      <span class="boot-ring dashed"></span>
      <span class="boot-disc"><img src="logo.png" alt=""></span>
    </div>

    <h1 class="boot-title">مزاد حراج واحد</h1>
    <p class="boot-tagline">المنصة الأولى لمزادات السيارات الفاخرة والنادرة بالمملكة</p>

    <div class="boot-grow low"></div>

    <div class="boot-status"><b aria-hidden="true"></b> جار تجهيز التطبيق…</div>

    <div class="boot-foot">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1C6FD6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>
      </svg>
      <span class="place">المملكة العربية السعودية • الرياض</span>
      <span class="ver">الإصدار 1.0.0</span>
    </div>
  </div>

  <script>
    // flutter-first-frame لا load: الثاني يقع حين تصل الملفّات، وبينه وبين
    // أوّل إطارٍ مرسومٍ ثوانٍ على جهازٍ بطيء — فتُرفع الشاشة على بياض.
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.classList.add('gone');
      setTimeout(function () { boot.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
