# haraj.spas.sa — مضيفٌ واحد، تطبيقان خلفه.
#
# **الجذرُ للعميل، واللوحةُ على مسارها.** كان كلُّ شيءٍ يذهب إلى جانغو،
# وجانغو يحوّل `/` إلى `/console/` — فمن فتح العنوانَ وجد شاشةَ دخولِ
# موظّفين، وواجهةُ العميل غيرَ منشورةٍ أصلاً. الآن:
#
#   /            ⇐ Next.js على 3000   (شاشات العميل: مزادات، محفظة، فواتير)
#   /console/    ⇐ جانغو على 8000     (لوحةُ الإدارة)
#   /admin/      ⇐ جانغو              (أدمن جانغو)
#   /api/v1/     ⇐ جانغو              (واجهةُ التطبيق المحمول)
#   /api/backend/⇐ Next               (ممرُّ الويب إلى الخلفية — لا يُطابق
#                                      `/api/v1/` فيسقط على `/`)
#
# **والترتيبُ هنا ليس ترتيبَ الملفّ بل طولَ البادئة**: nginx يختار أطولَ
# `location` مطابقة، فـ`/api/v1/` تسبق `/` مهما كُتبت. ولو أُضيفت يوماً
# `location /api/` لابتلعت ممرَّ Next صامتةً — فلا تُضف.
server {
    server_name haraj.spas.sa;

    client_max_body_size 25m;

    # ملفّاتُ جانغو الساكنة. وساكناتُ Next تحت `/_next/` فتذهب إليه.
    location /static/ {
        alias /srv/haraj/backend/staticfiles/;
        access_log off;
        expires 7d;
    }

    # صورُ المركبات بأسماءٍ فريدة (uuid) لا تُعاد كتابتُها — فتُخبَّأ في المتصفّح
    # شهراً ولا يُسأل عنها الخادمُ في كلّ زيارة. كانت بلا ترويسة تخبئةٍ أصلاً.
    location /media/ {
        alias /srv/haraj/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ــــ جانغو ــــ
    location = /health   { proxy_pass http://127.0.0.1:8000; include /etc/nginx/haraj-proxy.conf; }
    location /console/   { proxy_pass http://127.0.0.1:8000; include /etc/nginx/haraj-proxy.conf; }
    location /admin/     { proxy_pass http://127.0.0.1:8000; include /etc/nginx/haraj-proxy.conf; }
    location /webhooks/  { proxy_pass http://127.0.0.1:8000; include /etc/nginx/haraj-proxy.conf; }
    location /api/v1/    { proxy_pass http://127.0.0.1:8000; include /etc/nginx/haraj-proxy.conf; }
    location /api/schema/ { proxy_pass http://127.0.0.1:8000; include /etc/nginx/haraj-proxy.conf; }
    location /api/docs/  { proxy_pass http://127.0.0.1:8000; include /etc/nginx/haraj-proxy.conf; }

    # ــــ واجهةُ العميل: كلُّ ما بقي ــــ
    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/haraj-proxy.conf;
    }

    listen [::]:443 ssl http2 ipv6only=on; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/haraj.spas.sa/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/haraj.spas.sa/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = haraj.spas.sa) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    listen [::]:80 default_server;
    server_name haraj.spas.sa;
    return 404; # managed by Certbot
}
