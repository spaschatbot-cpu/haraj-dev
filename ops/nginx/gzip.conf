# مقتطفُ gzip من /etc/nginx/nginx.conf على الخادم (١٣ أكتوبر ٢٠٢٦).
#
# **كان الضغطُ لـHTML وحدها**: gzip_types وgzip_proxied معلَّقان كما يأتيان مع
# أوبونتو، فخرجت ملفّاتُ JavaScript وردودُ الواجهة JSON بلا ضغط — أوّلُ ملفّات
# Next وحده ١١٢ كيلوبايت، وقائمةُ المركبات ١٨ كيلوبايت. وبعد التفعيل: ٣٩٫٦ و٠٫٩.
#
# يُنسخ إلى كتلة http في nginx.conf، ولا يُضمَّن في ملفّ الموقع: gzip_types
# مكرَّرةٌ في http وفي server تُقرأ مرّتين بلا خطأ وبلا أثرٍ ظاهر.

  	gzip on;
  	gzip_vary on;
  	gzip_proxied any;
  	gzip_comp_level 5;
  	gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
