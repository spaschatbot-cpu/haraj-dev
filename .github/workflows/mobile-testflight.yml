name: mobile-testflight

# يبني التطبيقَ لـiOS موقَّعاً ويرفعه إلى App Store Connect، فيظهر في TestFlight.
#
# **لماذا هنا لا على جهاز المطوّر**: جهازُ التطوير ويندوز، وiOS لا يُبنى إلا
# على ماك — فالبناءُ على ماك GitHub.
#
# **ويُشغَّل باليد وحده** (Actions ← mobile-testflight ← Run workflow). السببان:
# دقيقةُ ماك تُحسب بعشر دقائق لينكس، وكلُّ تشغيلٍ رقمُ بناءٍ جديد في TestFlight.
#
# **والتوقيعُ سحابيّ** بمفتاح App Store Connect API: Xcode ينشئ الشهادةَ وملفَّ
# التزويد بنفسه (-allowProvisioningUpdates)، فلا ‎.p12 ولا ملفَّ تزويد في
# الأسرار يُجدَّد كلَّ سنة. وثمنُه أن المفتاح يحتاج دور **Admin**: التوقيعُ
# السحابيُّ للتوزيع لا يُتاح لدورٍ أدنى.
#
# الأسرار (Settings ← Secrets and variables ← Actions):
#   APPLE_TEAM_ID                 معرّفُ الفريق (عشرةُ محارف)
#   APP_STORE_CONNECT_KEY_ID      معرّفُ المفتاح
#   APP_STORE_CONNECT_ISSUER_ID   معرّفُ المُصدِر (UUID)
#   APP_STORE_CONNECT_KEY_P8      محتوى ملفّ AuthKey_XXXX.p8 كاملاً
# ومتغيّرٌ اختياريّ (Variables، لا Secrets):
#   IOS_BUNDLE_ID                 إن كان سجلُّ التطبيق في App Store Connect
#                                 بمعرّفٍ غير sa.harajwahed.harajMobile
#
# الخطوات من جهة Apple كاملةً في docs/testflight.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "رقم الإصدار (فارغ = من pubspec.yaml). يلزم أكبرَ من الإصدار المنشور إن كان للسجلّ إصدارٌ في المتجر."
        required: false
        default: ""

concurrency:
  group: testflight
  cancel-in-progress: false

defaults:
  run:
    working-directory: mobile

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'sa.harajwahed.harajMobile' }}
    steps:
      - uses: actions/checkout@v4

      # قبل دقائق الماك كلِّها: سرٌّ غائبٌ يُقال باسمه في أوّل ثانية، لا في
      # رسالة توقيعٍ مبهمة بعد عشرين دقيقة.
      - name: الأسرار حاضرة
        run: |
          missing=""
          for name in TEAM_ID KEY_ID ISSUER_ID KEY_P8; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::أسرارٌ غائبة:$missing — انظر docs/testflight.md" >&2
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: مفتاح App Store Connect
        # المسارُ الذي يبحث فيه xcodebuild وaltool بلا خيار. ويُحذف في آخر خطوة.
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          key=~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          printf '%s\n' "$KEY_P8" > "$key"
          chmod 600 "$key"
          echo "KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: معرّف التطبيق
        # يُكتب في المشروع لا في سطر xcodebuild: الخيارُ في السطر يسري على
        # أهداف Pods أيضاً، فتحمل كلُّ مكتبةٍ مضمَّنةٍ معرّفَ التطبيق نفسَه
        # وترفض Apple الحزمة (تصادمُ CFBundleIdentifier). والسطورُ المطابقة
        # هي هدفُ Runner وحده؛ هدفُ الاختبار ينتهي بـ.RunnerTests.
        run: |
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = sa\.harajwahed\.harajMobile;/PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};/" \
            ios/Runner.xcodeproj/project.pbxproj
          grep -c "PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};" ios/Runner.xcodeproj/project.pbxproj

      - name: إعداد المشروع (Flutter ثمّ Pods)
        # --config-only يكتب Generated.xcconfig بالإصدار ورقم البناء وتعريفات
        # دارت ويثبّت Pods، ثمّ يبني xcodebuild من المشروع نفسه فيقرؤها.
        # ورقمُ البناء رقمُ هذا السير: يزيد مع كلّ تشغيل، وTestFlight يرفض المكرَّر.
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "VERSION=$version" >> "$GITHUB_ENV"
          flutter pub get
          flutter build ios --release --no-codesign --config-only \
            --build-name "$version" \
            --build-number ${{ github.run_number }} \
            --dart-define=HARAJ_ENV=staging \
            --dart-define=HARAJ_API_BASE_URL=https://haraj.spas.sa \
            --dart-define=HARAJ_APP_VERSION=$version

      - name: أرشفة موقَّعة
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            | tail -n 200

      - name: التصدير والرفع إلى App Store Connect
        # destination=upload: التصديرُ نفسُه يرفع، فلا ipa على القرص ولا altool.
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          echo "### رُفع ${BUNDLE_ID} ${VERSION} (${{ github.run_number }})" >> "$GITHUB_STEP_SUMMARY"
          echo "يظهر في TestFlight بعد معالجة Apple (١٠–٣٠ دقيقة عادةً)." >> "$GITHUB_STEP_SUMMARY"

      - name: حذف المفتاح
        if: always()
        run: rm -rf ~/.appstoreconnect
