name: mobile

# بوابة تطبيق Flutter. مقصورة على mobile/ عمداً كي لا تتصادم مع بوابة الخلفية.
#
# ترتيب الخطوات هو ترتيب الميثاق (خطة الفريق §4): تنسيق ← تحليل ← اختبارات،
# ثم فحص أن العميل المولَّد يطابق المخطط.

on:
  push:
    paths:
      - "mobile/**"
      - "backend/openapi/schema.yaml"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "backend/openapi/schema.yaml"
      - ".github/workflows/mobile.yml"

defaults:
  run:
    working-directory: mobile

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # نسخة مثبَّتة لا `stable`: ترقية غير مقصودة للأدوات تكسر البناء
          # بلا تغيير سطر واحد عندنا.
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - run: flutter pub get

      - name: تنسيق
        run: dart format --output=none --set-exit-if-changed .

      - name: تحليل ساكن
        run: flutter analyze


  generated-client-matches-schema:
    # معيار قبول T702: كسر المخطط أو تعديل المولَّد بيد يُسقط الـCI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: إعادة التوليد من المخطط
        run: bash tool/regenerate_api_client.sh

      - name: الفرق يعني أن المرفوع لا يطابق المخطط
        run: git diff --exit-code -- lib/data/api/generated

  backend-schema-generates-a-dart-client:
    # معيار قبول T621 بنصّه: «ولّد عميل Dart منه في CI للتأكد من صلاحيته؛
    # وكسر المخطط يُسقط الـCI».
    #
    # **كُتبت هذه الوظيفة يوم كان `swagger_parser.yaml` على `haraj-mock.yaml`**،
    # فكانت تنسخ مخطّط الخلفية وتُبدّل `schema_path` إليه بـ`sed`. وقد نُقل
    # المولِّد منذُها إلى `../backend/openapi/schema.yaml` — فصار أحدُ تعبيرَي
    # `sed` لا يطابق شيئاً، والنسخةُ قبله ملفاً لا يقرؤه أحد. أي أن الخطوة كانت
    # تعلن ما لا تفعل، وتنجح، ولا يظهر ذلك في أي سجلّ. حُذف الميّت منها
    # (٢٠٢٦-٠٩-١٣) وبقي التحويل الحيّ وحده: مجلّدُ خرجٍ يُرمى.
    #
    # وما تبقّى من الفرق بينها وبين `generated-client-matches-schema` فوقها:
    # تلك تسأل «هل المولَّد المرفوع هو ما يولّده المخطط اليوم؟» وتحتاج
    # `build_runner` و`dart format` لتجيب؛ وهذه تسأل «هل المخطط يولّد عميلاً
    # أصلاً؟» بـ`swagger_parser` وحده. فمخطّطٌ يعجز عن إنتاج عميل يُسمّى هنا
    # بسببه، لا يُقرأ كـ«العميل المرفوع قديم» هناك.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - run: flutter pub get

      - name: التوليد إلى مجلّد يُرمى
        # في نسخة العمل الزائلة وحدها. الملف المرفوع لا يتغيّر، ولذلك لا
        # `git diff` بعد هذه الوظيفة: مخرَجها هو نجاحها أو فشلها، لا ملفّ.
        run: |
          sed -i -e 's#output_directory: lib/data/api/generated#output_directory: build/backend_client#' swagger_parser.yaml
          grep -q 'output_directory: build/backend_client' swagger_parser.yaml || {
            echo "::error::تحويلُ مجلّد الخرج لم يطابق — التوليد كان سيكتب فوق المرفوع." >&2
            exit 1
          }

      - name: توليد عميل Dart من المخطط
        run: dart run swagger_parser

      - name: مولِّدٌ لا يكتب شيئاً ينجح صامتاً
        # بلا هذه الخطوة تمرّ الوظيفة على مجلّدٍ فارغ، فتُعلن أن المخطط صالحٌ
        # وهي لم تولّد منه سطراً. الفحص الذي لا يجد ما يحرسه يصرخ (المادة ٤).
        run: |
          count=$(find build/backend_client -name '*.dart' | wc -l)
          echo "وُلِّد $count ملفاً"
          if [ "$count" -lt 10 ]; then
            echo "المخطط ولّد $count ملفاً فقط — لا عميل هنا." >&2
            exit 1
          fi

  android-build:
    # معيار قبول T717: «بناء إصدار ينجح للمنصتين».
    #
    # يُبنى هنا وليس على جهاز مطوّر: هذه هي البيئة الوحيدة التي يُتحقَّق فيها من
    # البناء بلا أسرار محلية ولا SDK مختلف، والادّعاء بلا تشغيل ليس تحقّقاً.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: بناء إصدار تطوير
        # بلا مفتاح توقيع، ولذلك dev لا prod: بناء prod بلا مفتاح يفشل عمداً،
        # والوظيفة التالية تثبت أنه يفشل.
        run: |
          flutter build apk --release --flavor dev --build-number 1 \
            --dart-define=HARAJ_ENV=development \
            --dart-define=HARAJ_API_BASE_URL=https://api.example.invalid

  android-production-refuses-to-build-unsigned:
    # الحارس الذي يهمّ فعلاً: حزمة إنتاج موقَّعة بمفتاح التصحيح تُبنى وتبدو
    # سليمة، ومفتاح التصحيح يملكه كل من استنسخ المستودع. الفشل هنا هو المطلوب.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: بناء إنتاج بلا مفتاح يجب أن يفشل
        run: |
          if flutter build appbundle --release --flavor prod --build-number 1 \
              --dart-define=HARAJ_ENV=production \
              --dart-define=HARAJ_API_BASE_URL=https://api.example.invalid; then
            echo "بُني إنتاج بلا مفتاح توقيع — الحارس لا يعمل." >&2
            exit 1
          fi

  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: بناء iOS بلا توقيع
        # التوقيع بشهادة الفريق في خطوة النشر، لا في CI عام: شهادة تمرّ من هنا
        # شهادةٌ في سجلّ بناء.
        run: |
          flutter build ios --release --no-codesign --build-number 1 \
            --dart-define=HARAJ_ENV=staging \
            --dart-define=HARAJ_API_BASE_URL=https://api.example.invalid
