# Local gate — the same three checks CI runs first, run before the commit
# exists, so a red CI is never the first time anyone hears about a formatting
# or typing problem.
#
#   uv tool install pre-commit && pre-commit install
#   (or: just setup — it does both)
#
# The mypy hook imports Django settings, so `backend/.env` must exist. `just
# setup` copies it from `.env.example`; without it the hook fails with
# "SECRET_KEY must be set outside DEBUG", which is the settings module doing
# its job (Article 5-3), not a broken hook.

default_language_version:
  python: python3.13

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      # Article 5-3: secrets live in the environment, never in the repository.
      # This catches the accident, not the deliberate leak — but the accident
      # is the one that actually happens.
      - id: detect-private-key
      - id: check-case-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # Not the upstream mirror: mypy needs the project's own dependencies and
      # the django-stubs plugin, and only the project environment has them.
      - id: mypy
        name: mypy (types)
        entry: uv run --directory backend mypy .
        language: system
        types: [python]
        pass_filenames: false

      # Article 3-2 — no float anywhere near money, not even in a report.
      - id: no-float-in-money
        name: no float on any money path
        entry: uv run --directory backend python ../ops/checks/no_float_in_money.py
        language: system
        types: [python]
        pass_filenames: false

      # Article 4-5 — one decision point each. Phase 005 wrote these four and
      # its own tests exercise them; they run here too, so the answer arrives
      # before the commit rather than inside a test report.
      - id: auction-state-single-writer
        name: only auctions.services moves a state
        entry: uv run --directory backend python ../ops/checks/auction_state_single_writer.py
        language: system
        types: [python]
        pass_filenames: false

      - id: one-vehicle-price
        name: a vehicle has one price
        entry: uv run --directory backend python ../ops/checks/one_vehicle_price.py
        language: system
        types: [python]
        pass_filenames: false

      - id: one-vehicle-card
        name: one serializer builds the vehicle card
        entry: uv run --directory backend python ../ops/checks/one_vehicle_card.py
        language: system
        types: [python]
        pass_filenames: false

      - id: one-sheet-writer
        name: one reader and writer of spreadsheets
        entry: uv run --directory backend python ../ops/checks/one_sheet_writer.py
        language: system
        types: [python]
        pass_filenames: false
