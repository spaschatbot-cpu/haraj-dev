{% comment %}
  رسمُ فعلٍ في صفّ — `<svg>` مضمَّنٌ من `icons.py`، لا إيموجي ولا خطُّ أيقونات.

  وجزئيّةٌ لا سطرٌ مكرَّر: كان كلُّ فعلٍ في «إدارة المستخدمين» يحمل نسخته من
  الوسم ومعها ستُّ خصائصِ نمطٍ مكتوبةً في `style=` — فأربعةُ أفعالٍ في الصفّ
  تعني أربعَ نسخٍ من السطر نفسه، وتغييرُ السمك يُنسى في واحدةٍ منها. والنمطُ
  الآن في `.act svg` بورقة الأنماط، وهذا الملفُّ يحمل الشكلَ وحده.
