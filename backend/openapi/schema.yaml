openapi: 3.0.3
info:
  title: Haraj One API
  version: 2.0.0
paths:
  /api/v1/auctions/:
    get:
      operationId: auctions_list
      description: '`GET /api/v1/auctions/` — the auctions a caller may see, newest
        first.'
      summary: قائمة المزادات
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
      - in: query
        name: state
        schema:
          enum:
          - draft
          - scheduled
          - live
          - ended
          - settled
          - cancelled
          - ''
          type: string
        description: |-
          * `draft` - مسودة
          * `scheduled` - مجدول
          * `live` - جارٍ
          * `ended` - منتهٍ
          * `settled` - مُسوّى
          * `cancelled` - ملغى
      tags:
      - v1
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuctionPage'
          description: ''
  /api/v1/auctions/{id}/:
    get:
      operationId: auctions_retrieve
      description: |-
        `GET /api/v1/auctions/{id}/` — one auction, in the list's own shape.

        Built by `cards.auction_card` with the same annotations the list uses, so
        the detail page and the row a customer tapped cannot disagree about how many
        cars an auction holds. An auction the caller may not see is a 404: a 403
        would confirm it exists, which is enough to enumerate auctions before they
        open.
      summary: تفاصيل المزاد
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuctionCard'
          description: ''
  /api/v1/auctions/{id}/vehicles/:
    get:
      operationId: auctions_vehicles_list
      description: '`GET /api/v1/auctions/{id}/vehicles/` — one auction''s cars.'
      summary: مركبات المزاد
      parameters:
      - in: query
        name: auction
        schema:
          type: integer
          minimum: 1
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
      - in: query
        name: make
        schema:
          type: string
          maxLength: 80
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
      - in: query
        name: search
        schema:
          type: string
          maxLength: 80
      - in: query
        name: state
        schema:
          enum:
          - draft
          - listed
          - bidding
          - awaiting_decision
          - awarded
          - rejected
          - invoiced
          - paid
          - released
          - withdrawn
          - relisted
          - ''
          type: string
        description: |-
          * `draft` - مسودة
          * `listed` - معروضة
          * `bidding` - تحت المزايدة
          * `awaiting_decision` - بانتظار قرار المالك
          * `awarded` - مرسّاة
          * `rejected` - مرفوضة
          * `invoiced` - مفوترة
          * `paid` - مسدَّدة
          * `released` - خرجت
          * `withdrawn` - مسحوبة
          * `relisted` - معادة للعرض
      - in: query
        name: year_from
        schema:
          type: integer
          maximum: 2200
          minimum: 1900
      - in: query
        name: year_to
        schema:
          type: integer
          maximum: 2200
          minimum: 1900
      tags:
      - v1
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehiclePage'
          description: ''
  /api/v1/auth/code/:
    post:
      operationId: v1_auth_code_create
      description: '`POST /api/v1/auth/code/` — send a one-time code to a mobile number.'
      summary: إرسال رمز تحقق
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendCode'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SendCode'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendCode'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendCodeResponse'
          description: ''
  /api/v1/auth/phone/change/:
    post:
      operationId: v1_auth_phone_change_create
      description: |-
        `POST /api/v1/auth/phone/change/` — send a code to both numbers.

        The only path in this file that requires a signed-in caller, and the number
        being left is read **off the token**, never off the request body. Letting the
        body name the current number would make this endpoint a way to move somebody
        else's account, which is the shape of the takeover it exists to close.
      summary: بدء تغيير رقم الجوال
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartPhoneChange'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StartPhoneChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StartPhoneChange'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartPhoneChangeResponse'
          description: ''
  /api/v1/auth/phone/change/confirm/:
    post:
      operationId: v1_auth_phone_change_confirm_create
      description: |-
        `POST /api/v1/auth/phone/change/confirm/` — both codes, or nothing.

        Answers 200 with the caller's own account, whose `phone` is the new number.
        Every session — this one included — is revoked by the service, so the client
        signs in again on the new number; that is deliberate, and
        `services.confirm_phone_change` says why.
      summary: تأكيد تغيير الجوال بالرمزين
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPhoneChange'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConfirmPhoneChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConfirmPhoneChange'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUser'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: v1_auth_refresh_create
      description: '`POST /api/v1/auth/refresh/` — spend a refresh token for a fresh
        pair.'
      summary: تجديد رمز الوصول
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Refresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Refresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Refresh'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/auth/verify/:
    post:
      operationId: v1_auth_verify_create
      description: '`POST /api/v1/auth/verify/` — exchange a correct code for a token
        pair.'
      summary: التحقق من الرمز وإصدار الرموز
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyCode'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyCode'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyCode'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/bids/{id}/withdraw/:
    post:
      operationId: bids_withdraw
      description: |-
        `POST /api/v1/bids/{id}/withdraw/` — pull a bid back.

        The bid is fetched **filtered by the caller** rather than fetched and then
        checked, so somebody else's bid id is a 404 and not a 403. The service
        refuses it a second time anyway (`NotYourBid`) — the two guards are not
        redundant: this one decides what a stranger learns, that one is the rule.
      summary: سحب مزايدة
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bid'
          description: ''
  /api/v1/bids/mine/:
    get:
      operationId: bids_mine
      description: '`GET /api/v1/bids/mine/` — the caller''s own bids, and only those.'
      summary: مزايداتي
      parameters:
      - in: query
        name: include_history
        schema:
          type: boolean
          default: false
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
      tags:
      - v1
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BidPage'
          description: ''
  /api/v1/devices/:
    get:
      operationId: devices_list
      description: '`POST`/`GET /api/v1/devices/` — register this handset, or list
        mine.'
      summary: أجهزتي
      tags:
      - v1
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
          description: ''
    post:
      operationId: devices_register
      description: '`POST`/`GET /api/v1/devices/` — register this handset, or list
        mine.'
      summary: تسجيل جهاز للإشعارات
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegistration'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceRegistration'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceRegistration'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
          description: ''
  /api/v1/devices/unregister/:
    post:
      operationId: devices_unregister
      description: |-
        `POST /api/v1/devices/unregister/` — this handset stops receiving mine.

        The app calls it on sign-out. Deleting the provider token on the handset is
        not enough on its own: the row here would keep a stranger's account name
        attached to a phone that changed hands, and a delivery report would still
        read as if the previous owner were reachable — the absence of a send is not
        evidence he was not told (Article 2-4).

        `POST` rather than `DELETE /devices/{token}`: the token is a credential for
        sending to the handset, and a path segment lands in every access log and
        proxy cache on the way.
      summary: إلغاء تسجيل جهاز
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceUnregistration'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceUnregistration'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceUnregistration'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/favourites/:
    get:
      operationId: favourites_list
      description: |-
        `GET /api/v1/favourites/` — the cars this customer marked, newest first.

        Rendered through `cards.vehicle_card`, like every other list of vehicles in
        the product: a favourites screen that assembled its own row would be the
        second card builder `ops/checks/one_vehicle_card.py` exists to refuse, and
        the field that went missing from it would be missing only here.

        The visibility rule still applies. A car marked while it was listed and
        since withdrawn is not shown — a favourite is a bookmark, never a claim, and
        it does not grant sight of a row its owner may no longer see.
      summary: المفضّلة
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
      tags:
      - v1
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehiclePage'
          description: ''
  /api/v1/favourites/{id}/:
    put:
      operationId: favourites_mark
      description: |-
        `PUT` and `DELETE /api/v1/favourites/{id}/` — mark and unmark.

        `PUT`, not `POST`, and both are idempotent: marking twice is marking once,
        and unmarking something unmarked is not an error. That is what a
        double-tapped heart and a retried request produce, and «هذه المركبة في
        مفضّلتك بالفعل» is a refusal for a thing that already happened the way the
        customer wanted.

        Both answer `204`. There is nothing to return — the client already knows
        which car it asked about, and a body here would be a second place the mark's
        shape is described.
      summary: إضافة إلى المفضّلة
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
    delete:
      operationId: favourites_unmark
      description: |-
        `PUT` and `DELETE /api/v1/favourites/{id}/` — mark and unmark.

        `PUT`, not `POST`, and both are idempotent: marking twice is marking once,
        and unmarking something unmarked is not an error. That is what a
        double-tapped heart and a retried request produce, and «هذه المركبة في
        مفضّلتك بالفعل» is a refusal for a thing that already happened the way the
        customer wanted.

        Both answer `204`. There is nothing to return — the client already knows
        which car it asked about, and a body here would be a second place the mark's
        shape is described.
      summary: إزالة من المفضّلة
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/invoices/:
    get:
      operationId: v1_invoices_list
      parameters:
      - name: limit
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: الفهرس الأولي الذي يجب البدء منه لإرجاع النتائج.
        schema:
          type: integer
      tags:
      - v1
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInvoiceList'
          description: ''
  /api/v1/invoices/{id}/:
    get:
      operationId: v1_invoices_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
          description: ''
  /api/v1/invoices/{id}/pay/:
    post:
      operationId: v1_invoices_pay_create
      description: |-
        Settle one invoice from the balance the customer already has with us.

        There is no card branch here and no card purpose to reach for: a purchase is
        paid from deposited money or by a bank transfer the bank confirms.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoicePay'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InvoicePay'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InvoicePay'
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
          description: ''
  /api/v1/live/:
    get:
      operationId: live_updates
      description: |-
        `GET /api/v1/live/` — server-sent events for the signed-in caller.

        A long-lived `text/event-stream`: the client opens it once and is told when
        something it may see has changed, instead of asking every two seconds. What
        may be seen is `apps.bidding.live`'s decision — **the caller's own bids and
        public states, never another bidder's number** — and that module's docstring
        is where the reasoning lives.

        Streaming without Channels
        --------------------------
        A `StreamingHttpResponse` over the ASGI application already in
        `config/asgi.py`. No Channels, no Redis, no second process: the added
        infrastructure would be a second thing to deploy, monitor and get wrong, and
        what it buys — push instead of a two-second re-derivation — is not
        perceptible to a person.

        The cost is one connection held per watching customer and one small query
        per connection per tick. That is a real cost and it is stated rather than
        hidden: it is the number to watch when this platform gets busy, and the
        moment it stops being acceptable is the moment Channels earns its place.

        Every stream ends
        -----------------
        After `MAX_STREAM_SECONDS` the server closes and the client reconnects. A
        stream that lives forever outlives the deploy that replaced the code running
        it, and the reconnect is what gets the customer onto the current version.
      summary: التحديث الحي
      tags:
      - v1
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                type: string
          description: ''
  /api/v1/participations/:
    get:
      operationId: participations_mine
      description: |-
        `GET /api/v1/participations/` — the auctions the caller is in.

        One row per auction, carrying the two facts a «مشاركاتي» screen needs and
        cannot combine for itself: how many of the caller's bids still stand, and
        what their deposit for that auction is doing.

        Why the server and not the screen
        ---------------------------------
        Both halves exist separately — `bids/mine/` and the wallet — and the app
        could in principle match one against the other. It must not. That match is a
        rule, and a rule in a screen is a second copy of a rule (Article 4-5): the
        day a hold is released or consumed while the bid rows stay exactly as they
        were, the screen's «محجوز» and the ledger's disagree, and the customer is
        told two different things about one deposit. The hold is the only thing that
        knows, so the hold is what this reads.

        Being *in* an auction is either half on its own: a standing bid, or money
        pinned to it. A bidder whose deposit is held but whose only bid was
        withdrawn is still in — otherwise their wallet shows 10,000 محجوز against a
        list that shows nothing holding it.

        No eligibility is decided here and none is read. This says what is, not what
        may be; `check_eligibility` remains the one door (T502).
      summary: مشاركاتي
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
      tags:
      - v1
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipationPage'
          description: ''
  /api/v1/payments/callback/:
    post:
      operationId: v1_payments_callback_create
      description: |-
        The gateway telling us what happened. The only path that credits a card.

        Stored raw and acknowledged before anything interprets it (Article 2-1), and
        never dropped: a message we cannot use is kept with the reason written on it
        (Article 2-2).
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/profile/:
    get:
      operationId: profile_retrieve
      description: '`GET`/`PATCH /api/v1/profile/` — the caller''s own account.'
      summary: ملفي الشخصي
      tags:
      - v1
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
    patch:
      operationId: profile_update
      description: '`GET`/`PATCH /api/v1/profile/` — the caller''s own account.'
      summary: تعديل الملف الشخصي
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdate'
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /api/v1/profile/company/:
    get:
      operationId: profile_company_retrieve
      description: '`GET`/`PUT /api/v1/profile/company/` — the company and its ZATCA
        address.'
      summary: ملف الشركة
      tags:
      - v1
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfileRead'
          description: ''
    put:
      operationId: profile_company_save
      description: '`GET`/`PUT /api/v1/profile/company/` — the company and its ZATCA
        address.'
      summary: حفظ ملف الشركة
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CompanyProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CompanyProfile'
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfileRead'
          description: ''
  /api/v1/profile/national-id/:
    put:
      operationId: profile_set_national_id
      description: |-
        `PUT /api/v1/profile/national-id/` — set it once it is right.

        A valid id already on the account is refused (`national_id_already_verified`);
        an invalid one may be replaced. `services.set_national_id` says why at
        length — the short version is that a customer who mistyped a digit must be
        able to fix themselves, and a correct id must not be swappable for
        somebody else's.
      summary: تثبيت رقم الهوية
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NationalId'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NationalId'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NationalId'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
  /api/v1/purchases/:
    get:
      operationId: v1_purchases_list
      description: Vehicles awarded to the caller, each with its live invoice.
      parameters:
      - name: limit
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: الفهرس الأولي الذي يجب البدء منه لإرجاع النتائج.
        schema:
          type: integer
      tags:
      - v1
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPurchaseList'
          description: ''
  /api/v1/vehicles/:
    get:
      operationId: vehicles_list
      description: '`GET /api/v1/vehicles/` — cars across auctions, searched and filtered.'
      summary: قائمة المركبات
      parameters:
      - in: query
        name: auction
        schema:
          type: integer
          minimum: 1
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
      - in: query
        name: make
        schema:
          type: string
          maxLength: 80
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
      - in: query
        name: search
        schema:
          type: string
          maxLength: 80
      - in: query
        name: state
        schema:
          enum:
          - draft
          - listed
          - bidding
          - awaiting_decision
          - awarded
          - rejected
          - invoiced
          - paid
          - released
          - withdrawn
          - relisted
          - ''
          type: string
        description: |-
          * `draft` - مسودة
          * `listed` - معروضة
          * `bidding` - تحت المزايدة
          * `awaiting_decision` - بانتظار قرار المالك
          * `awarded` - مرسّاة
          * `rejected` - مرفوضة
          * `invoiced` - مفوترة
          * `paid` - مسدَّدة
          * `released` - خرجت
          * `withdrawn` - مسحوبة
          * `relisted` - معادة للعرض
      - in: query
        name: year_from
        schema:
          type: integer
          maximum: 2200
          minimum: 1900
      - in: query
        name: year_to
        schema:
          type: integer
          maximum: 2200
          minimum: 1900
      tags:
      - v1
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehiclePage'
          description: ''
  /api/v1/vehicles/{id}/:
    get:
      operationId: vehicles_retrieve
      description: |-
        `GET /api/v1/vehicles/{id}/` — one car, through the one card builder.

        T609's whole requirement is that this returns the *same* fields as the list.
        It does so by construction rather than by discipline: both call
        `cards.vehicle_card`, and there is no second assembly of a vehicle anywhere
        (`ops/checks/one_vehicle_card.py` fails the build if one appears).

        A car the caller may not see is a 404, not a 403. A 403 confirms the row
        exists, which is enough to enumerate an auction before it opens.
      summary: تفاصيل المركبة
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleCard'
          description: ''
  /api/v1/vehicles/{id}/bids/:
    post:
      operationId: bids_place
      description: |-
        `POST /api/v1/vehicles/{id}/bids/` — bid, or be told exactly why not.

        Lowering a standing bid is refused the first time with
        `lower_needs_confirm` and accepted when the caller comes back with
        ``confirm_lower``. That two-step is T506: lowering is a real feature of a
        sealed auction and also exactly what a fat finger does, so it costs one
        deliberate extra round trip.

        The car is resolved through `visible_vehicles`, so bidding on something the
        caller cannot see is a 404 — the same answer as a car that does not exist,
        which is what stops the endpoint being used to probe an unopened auction.
      summary: وضع مزايدة
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceBid'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PlaceBid'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PlaceBid'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bid'
          description: ''
  /api/v1/wallet/:
    get:
      operationId: v1_wallet_retrieve
      description: The customer's money, split by the pot it is actually sitting in.
      tags:
      - v1
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
          description: ''
  /api/v1/wallet/refund-requests/:
    get:
      operationId: v1_wallet_refund_requests_list
      tags:
      - v1
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RefundRequest'
          description: ''
    post:
      operationId: v1_wallet_refund_requests_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequestCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefundRequestCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefundRequestCreate'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundRequest'
          description: ''
  /api/v1/wallet/topups/:
    get:
      operationId: v1_wallet_topups_list
      description: Start a card top-up, or list the ones this customer started.
      tags:
      - v1
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentIntent'
          description: ''
    post:
      operationId: v1_wallet_topups_create
      description: Start a card top-up, or list the ones this customer started.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopupCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TopupCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TopupCreate'
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'
          description: ''
  /api/v1/wallet/topups/{reference}/:
    get:
      operationId: v1_wallet_topups_retrieve
      description: |-
        Where the customer lands on return from the gateway.

        It reads one stored row and answers with it. Not a single query parameter is
        consulted — a return URL is under the payer's thumb, and in v1 that was
        enough to make the app believe a payment had succeeded. Money moves in
        :class:`PaymentCallbackView` and nowhere else.
      parameters:
      - in: path
        name: reference
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'
          description: ''
  /api/v1/wallet/topups/{reference}/checkout/:
    get:
      operationId: v1_wallet_topups_checkout_retrieve
      description: |-
        Hand the customer over to the gateway. One hop, decided on the server.

        A redirect and not a JSON body carrying a url: the client's whole job is to
        send the customer here, and a `302` is what a browser and a webview both
        already know how to follow. It also means the gateway's address never
        reaches either client, which is the point of `apps.money.gateway` — see the
        module docstring for why a "gateway url" field would have been the wrong
        shape.

        Nothing is charged here and no money moves. This is a signpost; the ledger
        is touched by :class:`PaymentCallbackView` and by nothing else.
      parameters:
      - in: path
        name: reference
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '302':
          description: No response body
        '409':
          description: No response body
        '503':
          description: No response body
  /api/v1/wallet/transactions/:
    get:
      operationId: v1_wallet_transactions_list
      description: Every ledger line belonging to the caller, newest first, paginated.
      parameters:
      - name: limit
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: الفهرس الأولي الذي يجب البدء منه لإرجاع النتائج.
        schema:
          type: integer
      tags:
      - v1
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLedgerEntryList'
          description: ''
components:
  schemas:
    AuctionCard:
      type: object
      description: The auction row, as `cards.auction_card` builds it.
      properties:
        id:
          type: integer
        number:
          type: integer
        title:
          type: string
        state:
          type: string
        state_label:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        vehicle_count:
          type: integer
          nullable: true
        open_vehicle_count:
          type: integer
          nullable: true
      required:
      - ends_at
      - id
      - number
      - open_vehicle_count
      - starts_at
      - state
      - state_label
      - title
      - vehicle_count
    AuctionPage:
      type: object
      properties:
        total:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/AuctionCard'
      required:
      - results
      - total
    AuthenticatedUser:
      type: object
      description: |-
        The caller's own account. Never anybody else's — the view reads it off
        the token, never off a request field.
      properties:
        id:
          type: integer
        phone:
          type: string
        display_name:
          type: string
        account_type:
          type: string
        is_new:
          type: boolean
      required:
      - account_type
      - display_name
      - id
      - is_new
      - phone
    Bid:
      type: object
      description: |-
        A bid as the owner of it sees it.

        Never anybody else's: a sealed auction's whole property is that bidders
        cannot see each other's numbers, so there is no endpoint here that lists the
        bids *on* a car — only the bids *by* the caller.
      properties:
        id:
          type: integer
        vehicle_id:
          type: integer
        auction_id:
          type: integer
        lot_number:
          type: integer
        vehicle_title:
          type: string
        amount:
          type: string
        placed_at:
          type: string
          format: date-time
        is_withdrawn:
          type: boolean
        is_superseded:
          type: boolean
      required:
      - amount
      - auction_id
      - id
      - is_superseded
      - is_withdrawn
      - lot_number
      - placed_at
      - vehicle_id
      - vehicle_title
    BidPage:
      type: object
      properties:
        total:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Bid'
      required:
      - results
      - total
    Bucket:
      type: object
      description: One named pot, with the count of entries that add up to it.
      properties:
        kind:
          type: string
        label:
          type: string
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        entry_count:
          type: integer
        statement:
          type: string
          description: Where to read the exact entries behind this number (Article
            1-6).
          readOnly: true
      required:
      - amount
      - entry_count
      - kind
      - label
      - statement
    CompanyProfile:
      type: object
      description: |-
        The company and its ZATCA national address.

        Nothing is `required` at this layer even though most of it is required for a
        *new* company: the exemption for companies that predate ZATCA's national
        address is a business rule with a date attached, and business rules live in
        the service layer. A serializer that hard-coded `required=True` would refuse
        an existing company its own edit form.
      properties:
        name:
          type: string
          maxLength: 200
        representative_name:
          type: string
          maxLength: 200
        commercial_register:
          type: string
          maxLength: 32
        vat_number:
          type: string
          maxLength: 32
        building_number:
          type: string
          maxLength: 8
        street:
          type: string
          maxLength: 200
        district:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 100
        postal_code:
          type: string
          maxLength: 8
    CompanyProfileRead:
      type: object
      description: The same fields plus whether they add up to something invoiceable.
      properties:
        name:
          type: string
          maxLength: 200
        representative_name:
          type: string
          maxLength: 200
        commercial_register:
          type: string
          maxLength: 32
        vat_number:
          type: string
          maxLength: 32
        building_number:
          type: string
          maxLength: 8
        street:
          type: string
          maxLength: 200
        district:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 100
        postal_code:
          type: string
          maxLength: 8
        is_complete:
          type: boolean
          readOnly: true
      required:
      - is_complete
    ConfirmPhoneChange:
      type: object
      description: |-
        Both codes, in one request.

        One request, not two, and that is the rule rather than a convenience: two
        requests would mean a server-side half-finished state in which one number is
        proven and the other is not — which is exactly the single-proof change that
        T604 exists to make impossible.
      properties:
        new_phone:
          type: string
          pattern: ^9665\d{8}$
        current_code:
          type: string
          description: الرمز المُرسَل إلى الرقم الحالي
          maxLength: 8
          minLength: 4
        new_code:
          type: string
          description: الرمز المُرسَل إلى الرقم الجديد
          maxLength: 8
          minLength: 4
      required:
      - current_code
      - new_code
      - new_phone
    Device:
      type: object
      description: A registered handset, as its owner sees it.
      properties:
        id:
          type: integer
        platform:
          type: string
        created_at:
          type: string
          format: date-time
        token_tail:
          type: string
          description: آخر ستة أحرف، للتمييز فقط
      required:
      - created_at
      - id
      - platform
      - token_tail
    DeviceRegistration:
      type: object
      description: One handset, identified by the token its push provider issued.
      properties:
        token:
          type: string
          maxLength: 255
        platform:
          $ref: '#/components/schemas/PlatformEnum'
      required:
      - platform
      - token
    DeviceUnregistration:
      type: object
      description: |-
        One handset going quiet, named by the same token it registered with.

        No `user` field here either, for the registration rule read backwards: a
        caller who could name an account would not read somebody's bid alerts, he
        would switch them off — and a bidder who stops being told he was outbid
        loses the auction without ever knowing there was a reason.
      properties:
        token:
          type: string
          maxLength: 255
      required:
      - token
    Hold:
      type: object
      description: A claim on part of the customer's insurance, and what it is claimed
        for.
      properties:
        id:
          type: integer
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        reason:
          $ref: '#/components/schemas/ReasonEnum'
        reason_label:
          type: string
          readOnly: true
        auction:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        invoice:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - auction
      - created_at
      - id
      - invoice
      - reason
      - reason_label
    Invoice:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        number:
          type: string
          maxLength: 64
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        amount_paid:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        outstanding:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        state:
          $ref: '#/components/schemas/InvoiceStateEnum'
        state_label:
          type: string
          readOnly: true
        issued_at:
          type: string
          format: date-time
        due_at:
          type: string
          format: date-time
          nullable: true
        payment_methods:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: The only two ways a purchase is ever paid for. Card is not
            one.
          readOnly: true
      required:
      - amount
      - amount_paid
      - id
      - issued_at
      - number
      - outstanding
      - payment_methods
      - state_label
    InvoicePay:
      type: object
      description: |-
        ``method`` accepts only what :class:`PaymentMethod` declares.

        ``card`` is not a member, so the schema itself rejects it and there is no
        branch anywhere that could accidentally grow one.
      properties:
        method:
          allOf:
          - $ref: '#/components/schemas/MethodEnum'
          default: balance
    InvoiceStateEnum:
      enum:
      - draft
      - open
      - partial
      - paid
      - cancelled
      type: string
      description: |-
        * `draft` - مسودة
        * `open` - مستحقة
        * `partial` - مسدَّدة جزئياً
        * `paid` - مسدَّدة
        * `cancelled` - ملغاة
    LedgerEntry:
      type: object
      description: One line of the statement, read straight off an ``Entry`` row.
      properties:
        id:
          type: integer
        transaction:
          type: string
          format: uuid
        kind:
          type: string
        description:
          type: string
          readOnly: true
        bucket:
          type: string
        bucket_label:
          type: string
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        direction:
          type: string
          readOnly: true
        occurred_at:
          type: string
          format: date-time
        memo:
          type: string
      required:
      - amount
      - bucket
      - bucket_label
      - description
      - direction
      - id
      - kind
      - memo
      - occurred_at
      - transaction
    LockedField:
      type: object
      description: |-
        A field the customer can read but not write, and why not.

        `reason` is Arabic and ready to put on a screen. It is a sentence rather
        than a code because there is no behaviour to branch on — the client shows
        the field closed and prints this beside it.
      properties:
        field:
          type: string
        reason:
          type: string
          description: سبب عربي جاهز للعرض
      required:
      - field
      - reason
    MethodEnum:
      enum:
      - balance
      - bank_transfer
      type: string
      description: |-
        * `balance` - من الرصيد
        * `bank_transfer` - تحويل بنكي
    NationalId:
      type: object
      description: |-
        Ten digits. Whether they are a *valid* identity is the service's call.

        The length check is here because it is a property of the field; the checksum
        is not, because T606's rule — a correct id is pinned, a wrong one may be
        corrected — needs one definition of "correct" and it lives in
        `apps.accounts.identity`.
      properties:
        national_id:
          type: string
          pattern: ^\d{10}$
      required:
      - national_id
    PaginatedInvoiceList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/Invoice'
    PaginatedLedgerEntryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/LedgerEntry'
    PaginatedPurchaseList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/Purchase'
    Participation:
      type: object
      properties:
        auction:
          $ref: '#/components/schemas/AuctionCard'
        bids_count:
          type: integer
        insurance:
          $ref: '#/components/schemas/ParticipationInsurance'
      required:
      - auction
      - bids_count
      - insurance
    ParticipationInsurance:
      type: object
      description: |-
        What this bidder's deposit for this auction is doing, per the ledger.

        Read off `money.Hold` and nothing else. The alternative — the app matching
        «مزايداتي» against «المحفظة» — is a rule in a screen, and it is wrong the
        moment a hold is released or consumed while the bids stay as they were.
      properties:
        state:
          type: string
        state_label:
          type: string
        amount:
          type: string
          nullable: true
        currency:
          type: string
          nullable: true
      required:
      - amount
      - currency
      - state
      - state_label
    ParticipationPage:
      type: object
      properties:
        total:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Participation'
      required:
      - results
      - total
    PatchedProfileUpdate:
      type: object
      description: |-
        What a customer may change about themselves, and nothing else.

        Every field here is optional, and `validate` refuses an empty body: a PATCH
        that changes nothing is almost always a client bug, and answering 200 to it
        hides the bug behind a success.

        Unknown keys are refused rather than dropped (T605). DRF's default is to
        ignore them, which turns a client's typo into a silent no-op — the customer
        presses save, sees no error, and the value never changes.
      properties:
        full_name:
          type: string
          maxLength: 200
        email:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
    PaymentIntent:
      type: object
      properties:
        reference:
          type: string
          maxLength: 64
        checkout_url:
          type: string
          description: |-
            Where to send this customer to pay, or `""` when nowhere.

            A url on **our** server, never the gateway's. Both clients then have one
            thing to do with it — send the customer there — and neither ever learns
            what a Moyasar is; switching gateway changes `apps.money.gateway` and
            rebuilds nothing (`docs` in that module say why at length).

            Empty when the intent cannot be paid — because it is finished, or
            because this environment has no gateway. A client showing a button for a
            succeeded top-up offers to take a second deposit; one showing it with no
            gateway sends a customer to a refusal. The absence of the control is the
            correct interface for both, and the *server* produces that absence so
            neither client has to remember to check.
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        currency:
          type: string
          maxLength: 3
        purpose:
          $ref: '#/components/schemas/PaymentIntentPurposeEnum'
        purpose_label:
          type: string
          readOnly: true
        state:
          $ref: '#/components/schemas/PaymentIntentStateEnum'
        state_label:
          type: string
          readOnly: true
        gateway:
          type: string
          maxLength: 32
        gateway_status_raw:
          type: string
          maxLength: 64
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - checkout_url
      - created_at
      - purpose
      - purpose_label
      - reference
      - state_label
      - updated_at
    PaymentIntentPurposeEnum:
      enum:
      - insurance_deposit
      type: string
      description: '* `insurance_deposit` - إيداع تأمين'
    PaymentIntentStateEnum:
      enum:
      - pending
      - succeeded
      - failed
      - cancelled
      - expired
      - disputed
      type: string
      description: |-
        * `pending` - بانتظار الدفع
        * `succeeded` - تمت
        * `failed` - فشلت
        * `cancelled` - ألغاها العميل
        * `expired` - انتهت مهلتها
        * `disputed` - محل نزاع
    PlaceBid:
      type: object
      description: One bid on one car.
      properties:
        amount:
          type: string
          pattern: ^\d{1,12}(\.\d{1,2})?$
        confirm_lower:
          type: boolean
          default: false
      required:
      - amount
    PlatformEnum:
      enum:
      - android
      - ios
      - web
      type: string
      description: |-
        * `android` - android
        * `ios` - ios
        * `web` - web
    Profile:
      type: object
      description: |-
        The caller's own account, as a screen shows it.

        Read-only fields are marked as such rather than merely ignored on write:
        a client generated from this schema then cannot offer a form field that
        silently does nothing, which is how v1's "edit profile" screen let people
        type a new phone number into a box that never saved it.
      properties:
        id:
          type: integer
          readOnly: true
        phone:
          type: string
          readOnly: true
          description: يتغيّر عبر مسار خاص
        display_name:
          type: string
          readOnly: true
        full_name:
          type: string
          maxLength: 200
        email:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        account_type:
          type: string
          readOnly: true
        national_id:
          type: string
          readOnly: true
        national_id_verified:
          type: boolean
          readOnly: true
        phone_verified_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        has_company_profile:
          type: boolean
          readOnly: true
        company_profile_complete:
          type: boolean
          readOnly: true
        locked_fields:
          type: array
          items:
            $ref: '#/components/schemas/LockedField'
          readOnly: true
      required:
      - account_type
      - company_profile_complete
      - display_name
      - full_name
      - has_company_profile
      - id
      - locked_fields
      - national_id
      - national_id_verified
      - phone
      - phone_verified_at
    Purchase:
      type: object
      description: A vehicle this customer won, with the invoice that followed it.
      properties:
        id:
          type: integer
        lot_number:
          type: integer
        make:
          type: string
        model:
          type: string
        year:
          type: integer
        state:
          type: string
        awarded_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        awarded_at:
          type: string
          format: date-time
        auction:
          type: object
          additionalProperties: {}
          readOnly: true
        invoice:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
      required:
      - auction
      - awarded_at
      - awarded_price
      - id
      - invoice
      - lot_number
      - make
      - model
      - state
      - year
    ReasonEnum:
      enum:
      - bidding
      - dues
      type: string
      description: |-
        * `bidding` - ضمان المزايدة
        * `dues` - مقابل مستحقات غير مسدَّدة
    Refresh:
      type: object
      properties:
        refresh:
          type: string
      required:
      - refresh
    RefundRequest:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        reference:
          type: string
          maxLength: 64
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
        state:
          $ref: '#/components/schemas/RefundRequestStateEnum'
        state_label:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - created_at
      - id
      - reference
      - state_label
    RefundRequestCreate:
      type: object
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
      required:
      - amount
    RefundRequestStateEnum:
      enum:
      - requested
      - sent
      - confirmed
      - rejected
      - cancelled
      type: string
      description: |-
        * `requested` - مُقدَّم
        * `sent` - أُرسل للمحاسبة
        * `confirmed` - نُفِّذ
        * `rejected` - مرفوض
        * `cancelled` - ألغاه العميل
    SendCode:
      type: object
      description: Ask for a code.
      properties:
        phone:
          type: string
          pattern: ^9665\d{8}$
        purpose:
          allOf:
          - $ref: '#/components/schemas/SendCodePurposeEnum'
          default: login
      required:
      - phone
    SendCodePurposeEnum:
      enum:
      - login
      - change_phone
      - recover
      type: string
      description: |-
        * `login` - دخول أو تسجيل
        * `change_phone` - تغيير رقم الجوال
        * `recover` - استعادة الحساب
    SendCodeResponse:
      type: object
      description: 'What the caller learns: that it went, and when it stops working.'
      properties:
        sent:
          type: boolean
        expires_at:
          type: string
          format: date-time
        resend_after:
          type: integer
          description: ثوانٍ حتى يُسمح بطلب رمز جديد
      required:
      - expires_at
      - resend_after
      - sent
    StartPhoneChange:
      type: object
      description: Ask for the pair of codes that a phone change needs.
      properties:
        new_phone:
          type: string
          pattern: ^9665\d{8}$
      required:
      - new_phone
    StartPhoneChangeResponse:
      type: object
      description: |-
        That both messages went, and when they stop working.

        Two booleans rather than one, because the screen has to tell the customer to
        go and look at two phones — one of which may be in a drawer.
      properties:
        sent_to_current:
          type: boolean
        sent_to_new:
          type: boolean
        expires_at:
          type: string
          format: date-time
        resend_after:
          type: integer
          description: ثوانٍ حتى يُسمح بطلب رمز جديد
      required:
      - expires_at
      - resend_after
      - sent_to_current
      - sent_to_new
    TokenPair:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        expires_in:
          type: integer
          description: عمر رمز الوصول بالثواني
        expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/AuthenticatedUser'
      required:
      - access
      - expires_at
      - expires_in
      - refresh
    TopupCreate:
      type: object
      description: A request to start a card top-up. It carries no amount, by design.
      properties:
        auction:
          type: integer
          nullable: true
    VehicleCard:
      type: object
      description: |-
        The vehicle card — the same fields in the list and on the detail page.

        T609's acceptance criterion is that those two are identical, and
        `test_vehicle_api.py` asserts it by comparing the key sets rather than by
        reading this class, so the guarantee does not depend on this file being
        kept honest by hand.
      properties:
        id:
          type: integer
        auction_number:
          type: integer
        auction_state:
          type: string
        lot_number:
          type: integer
        title:
          type: string
        make:
          type: string
        model:
          type: string
        year:
          type: integer
        odometer_km:
          type: integer
          nullable: true
        transmission:
          type: string
        transmission_label:
          type: string
        fuel_type:
          type: string
        fuel_type_label:
          type: string
        condition:
          type: string
        condition_label:
          type: string
        plate_type:
          type: string
        plate_type_label:
          type: string
        reserve_price:
          type: string
          nullable: true
        state:
          type: string
        state_label:
          type: string
        listing_state:
          type: string
        owner_company_name:
          type: string
          nullable: true
        thumbnail_url:
          type: string
          nullable: true
      required:
      - auction_number
      - auction_state
      - condition
      - condition_label
      - fuel_type
      - fuel_type_label
      - id
      - listing_state
      - lot_number
      - make
      - model
      - odometer_km
      - owner_company_name
      - plate_type
      - plate_type_label
      - reserve_price
      - state
      - state_label
      - thumbnail_url
      - title
      - transmission
      - transmission_label
      - year
    VehiclePage:
      type: object
      properties:
        total:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/VehicleCard'
      required:
      - results
      - total
    VerifyCode:
      type: object
      description: Prove the number.
      properties:
        phone:
          type: string
          pattern: ^9665\d{8}$
        code:
          type: string
          maxLength: 8
          minLength: 4
        full_name:
          type: string
          description: يُستعمل عند إنشاء الحساب لأول مرة فقط
          maxLength: 200
      required:
      - code
      - phone
    Wallet:
      type: object
      properties:
        currency:
          type: string
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        available:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        held_for_auctions:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        locked_for_dues:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/Bucket'
        holds:
          type: array
          items:
            $ref: '#/components/schemas/Hold'
        as_of:
          type: string
          format: date-time
      required:
      - as_of
      - available
      - buckets
      - currency
      - held_for_auctions
      - holds
      - locked_for_dues
      - total
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: رمز الوصول من `/api/v1/auth/verify/`. صالح لخمس عشرة دقيقة، ويُجدَّد
        من `/api/v1/auth/refresh/`.
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
